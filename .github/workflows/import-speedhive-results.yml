name: Import Speedhive Results

on:
  # Manual repair/test workflow.
  # Automatic race-day importing is driven by update-championship-data.yml,
  # whose scheduled trigger is already proven to run in this repository.
  workflow_dispatch:
    inputs:
      event:
        description: "Use auto, or supply a Speedhive event/search URL"
        required: false
        default: "auto"
        type: string
      round:
        description: "F300 championship round number (0 = auto-detect today's race)"
        required: false
        default: "0"
        type: string
      dry_run:
        description: "Test only - do not write to Google Sheets"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: f300-speedhive-import
  cancel-in-progress: false

jobs:
  import-speedhive:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Speedhive client and browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install "speedhive-tools==0.9.20" "requests>=2.32,<3" "playwright>=1.48,<2"
          python -m playwright install --with-deps chromium

      - name: Verify F300 importer file
        run: |
          echo "Importer file details:"
          ls -lh scripts/import-speedhive-results.py
          grep -n 'BOT_VERSION = "v1.2-f300-semantic-order-r5"' scripts/import-speedhive-results.py
          grep -n 'if __name__ == "__main__":' scripts/import-speedhive-results.py

      - name: Read and import Speedhive results
        env:
          F300_DATA_URL: ${{ secrets.F300_DATA_URL }}
          F300_TIMING_BOT_SECRET: ${{ secrets.F300_TIMING_BOT_SECRET }}
          SPEEDHIVE_ORG_ID: ${{ vars.SPEEDHIVE_ORG_ID }}
        run: |
          EXTRA=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA="--dry-run"
          fi

          python -u scripts/import-speedhive-results.py \
            --event "${{ inputs.event }}" \
            --round "${{ inputs.round }}" \
            $EXTRA

      - name: Set up Node.js
        if: inputs.dry_run == false
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh app championship data
        if: inputs.dry_run == false
        env:
          F300_DATA_URL: ${{ secrets.F300_DATA_URL }}
        run: node scripts/update-data.mjs

      - name: Commit app data if changed
        if: inputs.dry_run == false
        shell: bash
        run: |
          if git diff --quiet -- data.js; then
            echo "No app data changes detected."
            exit 0
          fi

          git config user.name "F300 Championship Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "Update championship data after Speedhive import"
          git pull --rebase origin main
          git push origin HEAD:main
