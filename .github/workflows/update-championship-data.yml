name: Update Championship Data

on:
  workflow_dispatch:

  schedule:
    # Runs automatically once per day
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: f300-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download latest championship data
        env:
          F300_DATA_URL: ${{ secrets.F300_DATA_URL }}
        run: node scripts/update-data.mjs

      - name: Commit data if changed
        shell: bash
        run: |
          if git diff --quiet -- data.js; then
            echo "No championship data changes detected."
            exit 0
          fi

          git config user.name "F300 Championship Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.js
          git commit -m "Update championship data"
          git push origin HEAD:main
