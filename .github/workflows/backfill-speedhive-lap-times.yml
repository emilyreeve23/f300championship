name: Backfill Speedhive Lap Times

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Optional rounds, e.g. 1,2,3,4. Leave blank to try all past/current rounds."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Test only - do not write to Google Sheets"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  backfill-speedhive-laps:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Speedhive client and browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install "speedhive-tools==0.9.20" "requests>=2.32,<3" "playwright>=1.48,<2"
          python -m playwright install --with-deps chromium

      - name: Verify F300 importer file
        run: |
          grep -n 'BOT_VERSION = "v1.2-speedhive-laps"' scripts/import-speedhive-results.py
          python -m py_compile scripts/import-speedhive-results.py scripts/backfill-speedhive-laps.py

      - name: Try historical F300 rounds
        env:
          F300_DATA_URL: ${{ secrets.F300_DATA_URL }}
          F300_TIMING_BOT_SECRET: ${{ secrets.F300_TIMING_BOT_SECRET }}
        run: |
          EXTRA=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA="--dry-run"
          fi

          python -u scripts/backfill-speedhive-laps.py \
            --rounds "${{ inputs.rounds }}" \
            $EXTRA
